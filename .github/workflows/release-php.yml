name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Instalar dependencias de produccion (Plugin Update Checker)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Create plugin ZIP
        run: |
          mkdir -p dist/mailpoet-bounce-handler
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.githooks' --exclude='.claude' \
            --exclude='dist' --exclude='scripts' \
            --exclude='composer.json' --exclude='composer.lock' \
            --exclude='phpcs.xml' --exclude='phpstan.neon' --exclude='phpstan-bootstrap.php' \
            --exclude='.gitignore' --exclude='.gitattributes' --exclude='.editorconfig' --exclude='.env' \
            --exclude='AGENTS.md' --exclude='CLAUDE.md' --exclude='CHANGELOG.md' \
            . dist/mailpoet-bounce-handler/
          cd dist && zip -r ../mailpoet-bounce-handler.zip mailpoet-bounce-handler/

      # Si el proyecto tiene deploy SFTP automático, añadir el step aquí.
      # Ver ejemplo en cozy-doodling-aurora.md (lftp mirror --reverse --delete).
      # Secrets necesarios: SFTP_HOST, SFTP_USERNAME, SFTP_PASSWORD.

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "No se encontró la sección ${VERSION} en CHANGELOG.md" && exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file NOTES.md \
            mailpoet-bounce-handler.zip
